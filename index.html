<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Meow Open City</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js",
        "animejs": "https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.es.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="rotate-overlay" class="rotate-overlay" style="display:none;">
    <div class="rotate-card">
      <div class="rotate-icon" aria-hidden="true">⟳</div>
      <div class="rotate-text">ROTATE TO LANDSCAPE</div>
    </div>
  </div>

  <div class="hud">
    <div id="hud-health" class="hud-health-bar">
      <div id="hud-health-fill" class="hud-health-fill"></div>
    </div>
    <div id="hud-wanted" class="hud-wanted">☆☆☆☆☆</div>
    <div id="hud-mission" class="hud-chip hud-mission">MISSION: VISIT OIL CO</div>

    <div class="hud-top-left">
      <div class="minimap-card">
        <canvas id="minimap" class="minimap" width="144" height="144"></canvas>
      </div>
      <div class="hud-chips-row">
        <div class="hud-chip hud-coin-pill">
          <span class="chip-label">COINS</span>
          <span id="hud-coins" class="chip-value">0</span>
        </div>
        <div class="hud-chip">
          <span class="chip-label">TIME</span>
          <span id="hud-time" class="chip-value">00:00</span>
        </div>
      </div>
    </div>

    <div class="hud-top-right">
      <div id="hud-combo" class="hud-combo"></div>
      <div class="hud-chip hud-time-pill">
        <span class="chip-label">CITY</span>
        <span id="hud-level" class="chip-value">FREE ROAM</span>
      </div>
      <div class="top-speedo">
        <div class="speedo-ring">
          <div class="speedo-inner">
            <span id="hud-speed-big" class="speedo-value">0</span>
            <span class="speedo-unit">KM/H</span>
          </div>
        </div>
      </div>
    </div>

    <div id="desktop-hints" class="desktop-hints">
      <span><kbd>W/A/S/D</kbd> or <kbd>Arrows</kbd> Drive</span>
      <span><kbd>Space</kbd> Drift</span>
      <span><kbd>P</kbd> Pause</span>
    </div>
  </div>

  <div class="touch-controls">
    <div class="touch-group-left">
      <button id="touch-left" class="touch-btn touch-steer" type="button" aria-label="Steer Left">L</button>
      <button id="touch-right" class="touch-btn touch-steer" type="button" aria-label="Steer Right">R</button>
    </div>
    <div class="touch-group-right">
      <button id="touch-drift" class="touch-btn touch-drift" type="button" aria-label="Drift">DRIFT</button>
      <button id="touch-brake" class="touch-btn touch-brake" type="button" aria-label="Brake or Reverse">REV</button>
      <button id="touch-gas" class="touch-btn touch-gas" type="button" aria-label="Accelerate">GAS</button>
    </div>
  </div>

  <div id="menu-overlay" class="overlay">
    <div class="overlay-card">
      <h1 class="game-title">MEOW OPEN CITY</h1>
      <p class="game-subtitle">Free-roam 3D street driving, traffic, drift &amp; city exploration.</p>
      <div class="overlay-actions">
        <button id="go-button" class="primary-button go-btn" type="button">GO</button>
        <button id="help-button" class="secondary-button" type="button">HELP</button>
        <button id="settings-button" class="secondary-button" type="button">SETTINGS</button>
      </div>
    </div>
  </div>

  <div id="pause-overlay" class="overlay hidden">
    <div class="overlay-card">
      <h2 class="pause-title">PAUSED</h2>
      <p class="game-subtitle">City traffic is waiting.</p>
      <div class="overlay-actions">
        <button id="resume-button" class="primary-button" type="button">RESUME</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { Game } from './js/game.js';
    window.addEventListener('DOMContentLoaded', () => {
      window.meowGame = new Game();
    });
  </script>
</body>
</html>
